<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحضير | اليوم العالمي للتلفزيون</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--navy:#0f2d52;--navy2:#173f6e;--gold:#c8a24a;--gold2:#e6cf8e;--bg:#f5f3ee;--text:#1b2433;--muted:#6b7280;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 20px 54px;text-align:center;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--gold)}
.tag{display:inline-block;border:1px solid var(--gold2);color:var(--gold2);padding:4px 14px;border-radius:99px;font-size:14px;margin-bottom:8px}
header h1{margin:0;font-size:27px;font-weight:800}
.tv{width:46px;height:46px;margin:0 auto 6px;display:block}
main{max-width:560px;margin:-36px auto 30px;padding:0 16px;position:relative}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,45,82,.10);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:21px;color:var(--navy)}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border:1.5px solid #d6dbe3;border-radius:12px;font:inherit;font-size:17px;background:#fafbfc}
input:focus{outline:none;border-color:var(--gold);background:#fff}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:14px;text-align:center}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{color:var(--bad);font-weight:700;margin-top:12px;min-height:1em}
.hidden{display:none!important}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#0b1a2e;min-height:260px}
.result{border-radius:16px;padding:22px;text-align:center;color:#fff;margin-top:14px}
.result .big{font-size:28px;font-weight:800;margin:4px 0}
.result.ok{background:var(--ok)}.result.warn{background:var(--warn)}.result.bad{background:var(--bad)}.result.idle{background:#e5e7eb;color:var(--muted)}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;color:var(--navy)}
.who button{background:none;border:0;color:var(--bad);font:inherit;cursor:pointer}
.mini{padding:0 22px;border:0;border-radius:10px;background:var(--gold);color:var(--navy);font:inherit;font-weight:700;cursor:pointer;flex:0 0 auto}
.count{text-align:center;color:var(--muted);margin-top:10px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 30px}
</style>
</head>
<body>
<header>
  <svg class="tv" viewBox="0 0 64 64" fill="none" stroke="#e6cf8e" stroke-width="3" stroke-linecap="round"><path d="M24 8l8 9 8-9"/><rect x="6" y="17" width="52" height="36" rx="6"/><rect x="12" y="23" width="32" height="24" rx="3"/><circle cx="51" cy="29" r="2.5"/><circle cx="51" cy="39" r="2.5"/><path d="M18 53l-3 5M46 53l3 5"/></svg>
  <span class="tag">إدارة التنظيم</span>
  <h1>اليوم العالمي للتلفزيون</h1>
</header>

<main id="pLogin">
  <div class="card">
    <h2>دخول المنظمين</h2>
    <form id="fLogin">
      <label>اسمك</label><input id="lName" placeholder="اسم المنظّم" required>
      <label>كلمة السر</label><input id="lPass" type="password" required>
      <button class="btn" id="bLogin">دخول</button>
      <div class="err" id="eLogin"></div>
    </form>
  </div>
</main>

<main id="pScan" class="hidden">
  <div class="card">
    <div class="who"><span id="whoName"></span><button id="bOut">خروج</button></div>
    <div id="reader"></div>
    <div class="row">
      <button class="btn" id="bCam">تشغيل الكاميرا</button>
      <button class="btn ghost" id="bFlip">تبديل الكاميرا</button>
    </div>
    <div class="result idle" id="res"><div class="big">جاهز للمسح</div><div>اضغط «تشغيل الكاميرا» ووجّه الباركود لها</div></div>
    <div class="count" id="count"></div>
  </div>
  <div class="card">
    <h2 style="font-size:17px">تحضير يدوي بالكود</h2>
    <form id="fManual" class="row"><input id="mCode" placeholder="TVXXXXXX" style="direction:ltr;text-transform:uppercase"><button class="mini">تحضير</button></form>
  </div>
</main>

<footer>جامعة القصيم · اليوم العالمي للتلفزيون ٢٠٢٦</footer>

<script>
/* رابط Apps Script */
const API_URL = 'https://script.google.com/macros/s/AKfycby8afwG6_YyER6IabhQL47Yyg6KZI5hkyvydLuEeN99SYdHzEjrQrvh_kmd3cogKUaXUg/exec';

const $ = id => document.getElementById(id);
const toEn = s => String(s||'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
let PASS = '', STAFF = '', done = 0;
try { PASS = sessionStorage.getItem('tvp') || ''; STAFF = sessionStorage.getItem('tvs') || ''; } catch(_) {}

async function api(data){
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify(data)});
  return r.json();
}

function showScan(){
  $('pLogin').classList.add('hidden'); $('pScan').classList.remove('hidden');
  $('whoName').textContent = 'المنظّم: ' + STAFF;
}
if (PASS && STAFF) showScan();

$('fLogin').addEventListener('submit', async e => {
  e.preventDefault(); $('eLogin').textContent = '';
  $('bLogin').disabled = true; $('bLogin').textContent = 'جاري الدخول...';
  try {
    const r = await api({action:'login', pass: $('lPass').value});
    if (!r.ok) throw new Error('كلمة السر غلط');
    PASS = $('lPass').value; STAFF = $('lName').value.trim();
    try { sessionStorage.setItem('tvp', PASS); sessionStorage.setItem('tvs', STAFF); } catch(_) {}
    showScan();
  } catch (err) { $('eLogin').textContent = err.message === 'كلمة السر غلط' ? err.message : 'مشكلة في الاتصال، حاول مرة ثانية'; }
  $('bLogin').disabled = false; $('bLogin').textContent = 'دخول';
});

$('bOut').onclick = async () => {
  await stopCam();
  try { sessionStorage.clear(); } catch(_) {}
  location.reload();
};

/* الكاميرا */
let scanner = null, facing = 'environment', busy = false, lastCode = '', lastAt = 0;
async function startCam(){
  if (!scanner) scanner = new Html5Qrcode('reader');
  try {
    if (scanner.isScanning) await scanner.stop();
    await scanner.start({facingMode: facing}, {fps: 12, qrbox: {width: 240, height: 240}}, onScan, () => {});
    $('bCam').textContent = 'إيقاف الكاميرا';
    setRes('idle', 'جاهز للمسح', 'وجّه الباركود للكاميرا');
  } catch (err) {
    setRes('bad', 'ما قدرنا نفتح الكاميرا', 'اسمح للمتصفح باستخدام الكاميرا ثم اضغط تشغيل مرة ثانية');
  }
}
async function stopCam(){
  if (scanner && scanner.isScanning) { try { await scanner.stop(); } catch(_) {} }
  $('bCam').textContent = 'تشغيل الكاميرا';
}
$('bCam').onclick = () => (scanner && scanner.isScanning) ? stopCam() : startCam();
$('bFlip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };

function onScan(text){
  const code = String(text).trim().toUpperCase(), now = Date.now();
  if (busy || (code === lastCode && now - lastAt < 5000)) return;
  lastCode = code; lastAt = now; doCheckin(code);
}
$('fManual').addEventListener('submit', e => {
  e.preventDefault();
  const c = toEn($('mCode').value).trim().toUpperCase();
  if (c) { doCheckin(c); $('mCode').value = ''; }
});

async function doCheckin(code){
  busy = true; setRes('idle', 'جاري التحقق...', '');
  try {
    const r = await api({action:'checkin', pass: PASS, code, staff: STAFF});
    if (r.err === 'pass') { setRes('bad', 'انتهت الجلسة', 'اضغط خروج وادخل من جديد'); }
    else if (!r.ok) { setRes('bad', '❌ غير مسجّل', 'الكود: ' + code); beep(220, .35); }
    else if (r.status === 'already') { setRes('warn', '⚠️ محضّر من قبل', r.name + ' · الساعة ' + r.time + (r.by ? ' · بواسطة ' + r.by : '')); beep(440, .25); }
    else { done++; $('count').textContent = 'حضّرت ' + done + ' شخص في هذي الجلسة'; setRes('ok', '✅ أهلًا ' + r.name, (r.type || '') + ' · تم التحضير ' + r.time); beep(880, .15); }
  } catch (err) { setRes('bad', 'مشكلة في الاتصال', 'تأكد من الإنترنت وحاول مرة ثانية'); }
  setTimeout(() => { busy = false; }, 1500);
}
function setRes(c, big, small){
  const el = $('res'); el.className = 'result ' + c; el.innerHTML = '';
  const b = document.createElement('div'); b.className = 'big'; b.textContent = big;
  const s = document.createElement('div'); s.textContent = small;
  el.append(b, s);
}
function beep(f, d){ try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = f; o.connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch(_) {} }
</script>
</body>
</html>
